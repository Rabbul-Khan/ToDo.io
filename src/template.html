<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="#" />
    <title>ToDo.io</title>
  </head>
  <body>
    <nav class="nav">
      <div class="nav__icons-left-container">
        <div class="nav__icons-menu icon material-icons">menu</div>
        <div class="nav__icons-home icon material-icons">home</div>
        <div class="nav__icons-search icon material-icons">search</div>
      </div>
      <div class="nav__brand">ToDo.io</div>
      <div class="nav__icons-right-container">
        <div class="nav__icons-add icon material-icons">add</div>
        <div class="nav__icons-person icon material-icons">person</div>
      </div>
    </nav>

    <main class="main-container">
      <div class="main-container__sidebar">
        <div class="sidebar__header">
          <div class="sidebar__title">Personal Space</div>
          <div class="sidebar__subtitle">Productivity Workspace</div>
        </div>

        <div class="sidebar__nav">
          <button class="sidebar__nav-item is-active btn" type="button">
            <span class="sidebar__nav-icon icon material-icons">inbox</span>
            Inbox
          </button>
        </div>

        <div class="sidebar__section-title">My Projects</div>
        <div class="sidebar__project-container">
          <div class="project-container__project active inbox">
            <div class="project-container__project-name-and-icon">
              <span class="sidebar__icon-inbox icon material-icons">
                inbox
              </span>
              <div class="project-container__project-name">Inbox</div>
            </div>
          </div>
        </div>
        
        <div class="modal sidebar__modal">
          <div class="modal__content">
            <form onsubmit="return false" class="modal__add-project-form form">
              <input
                type="text"
                class="form__input-project-name input"
                placeholder="Project name"
              />
            </form>
            <div class="modal__btn-container">
              <button
                class="add-project-modal__btn-cancel modal__btn-cancel btn"
              >
                Cancel
              </button>
              <button
                class="add-project-modal__btn-submit modal__btn-submit btn"
              >
                Submit
              </button>
            </div>
          </div>
        </div>

        <button class="add-project-btn btn add-btn">
          <div class="add-project-btn__icons-add icon material-icons"></div>
          <div class="add-project-btn__text">Add project</div>
        </button>

        <div class="sidebar__footer">
          <button class="sidebar__nav-item btn" type="button">
            <span class="sidebar__nav-icon icon material-icons">help</span>
            Help
          </button>
          <button class="sidebar__nav-item btn" type="button">
            <span class="sidebar__nav-icon icon material-icons">archive</span>
            Archive
          </button>
        </div>
      </div>

      <div class="main-container__main-content">
        <div class="content-shell">
          <div class="task-list-container active">
            
            <div class="task-list__header-row">
              <div class="task-list__title-area">
                <div class="date-container">
                  <div class="date-container__today-day">Today</div>
                  <div class="date-container__current-date"></div>
                </div>
                <h1 class="task-list__title">Inbox</h1>
              </div>
              <button class="task-list__clear-completed btn" type="button">
                Clear completed
              </button>
            </div>

            <div class="task-list__filters">
              <div class="task-list__filter-tabs">
                <button class="task-list__filter-tab btn" data-filter="all">
                  All
                </button>
                <button class="task-list__filter-tab btn" data-filter="active">
                  Active
                </button>
                <button
                  class="task-list__filter-tab btn"
                  data-filter="completed"
                >
                  Completed
                </button>
              </div>
              
              <div class="task-list__search-filter-group">
                <div class="task-list__input-group">
                  <span class="task-list__input-icon icon material-icons">
                    search
                  </span>
                  <input
                    type="text"
                    class="task-list__search input"
                    placeholder="Search tasks"
                  />
                </div>
                <div class="task-list__input-group">
                  <span class="task-list__input-icon icon material-icons">
                    filter_list
                  </span>
                  <input
                    type="text"
                    class="task-list__tag-filter input"
                    placeholder="Filter by tag"
                  />
                </div>
              </div>
            </div>

            <div class="task-list__panel">
              <div class="task-list__empty">No tasks yet</div>
              <div class="task-container"></div>
            </div>

            <button class="add-task-btn btn">
              <div class="add-task-btn__icons-add icon material-icons"></div>
              Add task
            </button>

            <div class="modal main-container__modal">
              <div class="modal__content">
                <form
                  onsubmit="return false"
                  class="modal__add-task-form form"
                  id="addTaskForm"
                >
                  <div class="form__field">
                    <input
                      type="text"
                      class="form__input-task-name input"
                      placeholder="Task name"
                      required="required"
                    />
                  </div>

                  <div class="form__field">
                    <textarea
                      class="form__input-task-description input"
                      placeholder="Description"
                    ></textarea>
                  </div>

                  <div class="form__field">
                    <input
                      type="text"
                      class="form__input-task-tags input"
                      placeholder="Tags (comma separated)"
                    />
                  </div>

                  <div class="form__sub-container">
                    <div class="form__date-wrapper">
                      <input type="date" class="form__input-due-date input" />
                    </div>

                    <div class="priority-selector-wrapper">
                      <label class="priority-capsule high">
                        <input
                          label="High"
                          type="radio"
                          class="form__input-priority--high form__input-priority"
                          name="priority"
                        />
                        <span class="priority-capsule__label">High</span>
                      </label>
                      <label class="priority-capsule mid">
                        <input
                          label="Mid"
                          type="radio"
                          class="form__input-priority--mid form__input-priority"
                          name="priority"
                          checked="true"
                        />
                        <span class="priority-capsule__label">Mid</span>
                      </label>
                      <label class="priority-capsule low">
                        <input
                          label="Low"
                          type="radio"
                          class="form__input-priority--low form__input-priority"
                          name="priority"
                        />
                        <span class="priority-capsule__label">Low</span>
                      </label>
                    </div>
                  </div>
                </form>
                <div class="modal__btn-container">
                  <button
                    class="add-task-modal__btn-cancel modal__btn-cancel btn"
                  >
                    Cancel
                  </button>
                  <button
                    class="add-task-modal__btn-submit modal__btn-submit btn"
                    type="submit"
                    form="addTaskForm"
                  >
                    Submit
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <template>
      <div class="content-shell">
        <div class="task-list-container">
          
          <div class="task-list__header-row">
            <div class="task-list__title-area">
              <div class="date-container">
                <div class="date-container__today-day">Today</div>
                <div class="date-container__current-date"></div>
              </div>
              <h1 class="task-list__title">Inbox</h1>
            </div>
            <button class="task-list__clear-completed btn" type="button">
              Clear completed
            </button>
          </div>

          <div class="task-list__filters">
            <div class="task-list__filter-tabs">
              <button class="task-list__filter-tab btn" data-filter="all">
                All
              </button>
              <button class="task-list__filter-tab btn" data-filter="active">
                Active
              </button>
              <button
                class="task-list__filter-tab btn"
                data-filter="completed"
              >
                Completed
              </button>
            </div>
            
            <div class="task-list__search-filter-group">
              <div class="task-list__input-group">
                <span class="task-list__input-icon icon material-icons">
                  search
                </span>
                <input
                  type="text"
                  class="task-list__search input"
                  placeholder="Search tasks"
                />
              </div>
              <div class="task-list__input-group">
                <span class="task-list__input-icon icon material-icons">
                  filter_list
                </span>
                <input
                  type="text"
                  class="task-list__tag-filter input"
                  placeholder="Filter by tag"
                />
              </div>
            </div>
          </div>

          <div class="task-list__panel">
            <div class="task-list__empty">No tasks yet</div>
            <div class="task-container"></div>
          </div>

          <button class="add-task-btn btn">
            <div class="add-task-btn__icons-add icon material-icons"></div>
            Add task
          </button>

          <div class="modal main-container__modal">
            <div class="modal__content">
              <form
                onsubmit="return false"
                class="modal__add-task-form form"
                id="addTaskForm"
              >
                <div class="form__field">
                  <input
                    type="text"
                    class="form__input-task-name input"
                    placeholder="Task name"
                    required="required"
                  />
                </div>

                <div class="form__field">
                  <textarea
                    class="form__input-task-description input"
                    placeholder="Description"
                  ></textarea>
                </div>

                <div class="form__field">
                  <input
                    type="text"
                    class="form__input-task-tags input"
                    placeholder="Tags (comma separated)"
                  />
                </div>

                <div class="form__sub-container">
                  <div class="form__date-wrapper">
                    <input type="date" class="form__input-due-date input" />
                  </div>

                  <div class="priority-selector-wrapper">
                    <label class="priority-capsule high">
                      <input
                        label="High"
                        type="radio"
                        class="form__input-priority--high form__input-priority"
                        name="priority"
                      />
                      <span class="priority-capsule__label">High</span>
                    </label>
                    <label class="priority-capsule mid">
                      <input
                        label="Mid"
                        type="radio"
                        class="form__input-priority--mid form__input-priority"
                        name="priority"
                        checked="true"
                      />
                      <span class="priority-capsule__label">Mid</span>
                    </label>
                    <label class="priority-capsule low">
                      <input
                        label="Low"
                        type="radio"
                        class="form__input-priority--low form__input-priority"
                        name="priority"
                      />
                      <span class="priority-capsule__label">Low</span>
                    </label>
                  </div>
                </div>
              </form>
              <div class="modal__btn-container">
                <button
                  class="add-task-modal__btn-cancel modal__btn-cancel btn"
                >
                  Cancel
                </button>
                <button
                  class="add-task-modal__btn-submit modal__btn-submit btn"
                  type="submit"
                  form="addTaskForm"
                >
                  Submit
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>
  </body>
</html>
